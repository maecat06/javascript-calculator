<!DOCTYPE html>
<html>
<head>
    <title>Four Function Calculator</title>

    <script>
        function add() {
            let a = Number(document.getElementById("fn").value);
            let b = Number(document.getElementById("sn").value);
            let c = a + b;
            document.getElementById("ans").innerHTML = c;
        }

        function subtract() {
            let a = Number(document.getElementById("fn").value);
            let b = Number(document.getElementById("sn").value);
            let c = a - b;
            document.getElementById("ans").innerHTML = c;
        }

        function multiply() {
            let a = Number(document.getElementById("fn").value);
            let b = Number(document.getElementById("sn").value);
            let c = a * b;
            document.getElementById("ans").innerHTML = c;
        }

        function divide() {
            let a = Number(document.getElementById("fn").value);
            let b = Number(document.getElementById("sn").value);

            if (b === 0) {
                document.getElementById("ans").innerHTML =
                    "Cannot divide by zero";
            } else {
                let c = a / b;
                document.getElementById("ans").innerHTML = c;
            }
        }
    </script>
</head>

<body>
    <h2>Four Function Calculator</h2>

    <p>
        First number?
        <input id="fn" type="number" step="any">
    </p>

    <p>
        Second number?
        <input id="sn" type="number" step="any">
    </p>

    <button onclick="add()">Add</button>
    <button onclick="subtract()">Subtract</button>
    <button onclick="multiply()">Multiply</button>
    <button onclick="divide()">Divide</button>

    <h3>Your answer is: <span id="ans">________</span></h3>

</body>
</html>
