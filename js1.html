<!DOCTYPE html>
<html>
<head>
    <title>One Function Calculator</title>

    <script>
        function add() {
            let a = document.getElementById("fn").value;
            let b = document.getElementById("sn").value;
            let c = Number(a) + Number(b);

            document.getElementById("ans").innerHTML = c;
        }
    </script>
</head>

<body>
    <h3>Simple JavaScript Calculator</h3>

    <p>
        First number? <input id="fn" type="number"><br>
        Second number? <input id="sn" type="number"><br>
        <button onclick="add()">Add the Numbers</button>
    </p>

    <p>Your answer is <span id="ans">_____________</span></p>
</body>
</html>
